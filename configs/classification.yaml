backbone:
  model_name: vit_huge
  checkpoint_path: null
  img_size: 224
  patch_size: 14
  freeze: true

task:
  type: classification
  num_classes: null             # null이면 train_dir 기준 자동 추론 (Food-101 => 101)
  head_mode: linear             # linear | attentive | multi_layer_mlp | global_local_fusion
  pool_last_n: 4                # head_mode=multi_layer_mlp에서 사용
  head_hidden_dim: null         # null이면 내부 기본값 사용
  local_ratio: 0.5              # head_mode=global_local_fusion에서 local branch 비율

data:
  train_dir: /path/to/train
  val_dir: /path/to/val

training:
  epochs: 100
  batch_size: 128
  lr: 0.0005
  head_lr_mult: 5.0             # head learning rate multiplier (vs backbone)
  weight_decay: 0.01
  scheduler: cosine
  use_layer_decay: false        # true일 때 backbone에 layer-wise lr decay 적용
  layer_decay: 0.75
  unfreeze_schedule: []         # 예: [{epoch: 20, unfreeze_last_n: 4}, {epoch: 40, unfreeze_last_n: 8}]
  num_workers: 8
  device: cuda
  mixed_precision: true
  label_smoothing: 0.1
  max_grad_norm: 1.0
  log_interval: 50
  save_dir: ./checkpoints/classification

seed: 42
