backbone:
  model_name: vit_huge
  checkpoint_path: null
  img_size: 224
  patch_size: 14
  freeze: true

task:
  type: classification
  num_classes: null            # null이면 train_dir 기준 자동 추론
  head_mode: attentive          # linear | attentive

data:
  train_dir: /path/to/train
  val_dir: /path/to/val

training:
  epochs: 100
  batch_size: 128
  lr: 0.0005
  weight_decay: 0.01
  scheduler: cosine
  num_workers: 8
  device: cuda
  mixed_precision: true
  label_smoothing: 0.1
  max_grad_norm: 1.0
  log_interval: 50
  save_dir: ./checkpoints/classification

seed: 42
